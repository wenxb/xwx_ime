[workspace]
members = [
    "crates/xwx_config",
    "crates/xwx_engine",
    "crates/xwx_ibus",
    "crates/xwx_setup",
]
resolver = "2"

[package]
name        = "xwx_ime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "XWX 拼音输入法（IBus 引擎）"

[[bin]]
name = "xwx_ime"
path = "src/main.rs"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["xwx"]
license = "MIT"

[workspace.dependencies]
# shared across crates
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror   = "1"
xwx_config  = { path = "crates/xwx_config" }
xwx_engine  = { path = "crates/xwx_engine" }
xwx_ibus    = { path = "crates/xwx_ibus" }

[dependencies]
xwx_config.workspace   = true
xwx_engine.workspace   = true
xwx_ibus.workspace     = true
tokio.workspace        = true
tracing.workspace      = true
tracing-subscriber.workspace = true
zbus      = { version = "4", features = ["tokio"] }
zvariant  = { version = "4", features = ["gvariant"] }

[dev-dependencies]
tempfile = "3"
# Integration tests (tests/) speak D-Bus through zbus, whose `call_method` is
# bounded on `serde::Serialize`. The workspace already resolves serde; this
# only makes it nameable from the integration-test crate.
serde = { workspace = true }

# ---- deb 打包（cargo deb）----
# XML 必须进 /usr/share/ibus/component/（IBus 不扫用户目录）。
# 引擎二进制随包进 /usr/libexec/ibus-engine-xwx（发行惯例，ibus-rime/
# ibus-libpinyin 同款布局），用户不直接调用。
# 打包前运行 `just deb`：先生成 exec=/usr/libexec/ibus-engine-xwx 的
# XML 到 data/debian/xwx.xml，再 cargo deb 打进系统目录。
[package.metadata.deb]
section       = "utils"
priority      = "optional"
maintainer    = "xwx <xwx@localhost>"
extended-description = "XWX 拼音输入法（Rust 实现的 IBus 引擎）。"
copyright     = "2026 xwx"
recommends    = "ibus"
maintainer-scripts = "data/debian"
assets = [
    ["data/debian/xwx.xml", "usr/share/ibus/component/xwx.xml", "644"],
    ["target/release/xwx_ime", "usr/libexec/ibus-engine-xwx", "755"],
    # 首选项面板:GNOME 系统设置按 `ibus-setup-<引擎名>.desktop` 找它,
    # Exec 必须是绝对路径(系统目录里没有 $PATH 解析)。
    ["target/release/ibus-setup-xwx", "usr/libexec/ibus-setup-xwx", "755"],
    ["data/ibus-setup-xwx.desktop", "usr/share/applications/ibus-setup-xwx.desktop", "644"],
    # 主词库随包分发;简拼副索引(abbrev.bin)与音节图索引(syllable_graph.bin)
    # 是 dict.bin 的 100% 确定性派生索引,在安装期(postinst)或首次启动时由引擎
    # 直接从 dict.bin 本地构建,不再随包分发(省去 ~51.4 MiB 原始 / ~24.3 MiB xz)。
    ["data/dict.bin", "usr/share/xwx/dict.bin", "644"],
    ["data/wanxiang-lts-zh-hans.gram", "usr/share/xwx/wanxiang-lts-zh-hans.gram", "644"],
    # 中文候选与按键行为完全不受影响(可选的降级面)。由
    # `python3 scripts/build_english_dict.py --wordfreq ...` 生成,不进 git。
    ["data/english.bin", "usr/share/xwx/english.bin", "644"],
    # M2 静态二元词频表（SymSpell 243_342 编译而来，约 2.4 MB），同样可选：
    # 缺了只降级条件排序与零输入预测，英文补全与中文都不受影响。
    ["data/english_bigram.bin", "usr/share/xwx/english_bigram.bin", "644"],
    # 英文数据的署名与许可:wordfreq 的**数据**按 CC BY-SA 4.0 再分发
    # (软件许可是 Apache-2.0,不覆盖数据),派生数据产品必须随包带上署名。
    ["data/english/NOTICE.md", "usr/share/doc/xwx-ime/english-data-NOTICE.md", "644"],
    ["data/english/LICENSES/wordfreq-LICENSE.txt", "usr/share/doc/xwx-ime/wordfreq-LICENSE.txt", "644"],
    ["data/english/LICENSES/CC-BY-SA-4.0.txt", "usr/share/doc/xwx-ime/CC-BY-SA-4.0.txt", "644"],
    ["data/english/LICENSES/Apache-2.0.txt", "usr/share/doc/xwx-ime/Apache-2.0.txt", "644"],
    # SymSpell 数据来源说明（仓库代码是 MIT，但数据条款要单独记录）。
    ["data/english/LICENSES/SymSpell-NOTICE.md", "usr/share/doc/xwx-ime/english-bigram-NOTICE.md", "644"],
]